<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>zigi.zip · {{ code }}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
{{ base_css | safe }}
html, body { margin: 0; height: 100%; max-width: none; padding: 0; }
body { display: flex; flex-direction: column; }
#bar {
  display: flex; align-items: center; gap: 1rem;
  padding: 0.5rem 0.75rem;
  border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent);
  font-size: 0.85rem;
}
#bar .spacer { flex: 1; }
#status, #lang { opacity: 0.7; }
a.code { text-decoration: none; font-weight: 600; }
#main { flex: 1; min-height: 0; display: flex; }
#editor { flex: 1; min-width: 0; min-height: 0; }
#files {
  width: 340px; flex: none; box-sizing: border-box; overflow-y: auto;
  padding: 0.75rem; display: flex; flex-direction: column; gap: 0.75rem;
  border-left: 1px solid color-mix(in srgb, currentColor 15%, transparent);
  font-size: 0.85rem;
}
#files p { margin: 0; }
#files .head { font-weight: 600; }
#files table { border-collapse: collapse; width: 100%; }
#files th, #files td { text-align: left; padding: 0.3rem 0.4rem; white-space: nowrap;
  border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent); }
#files td.name { white-space: normal; word-break: break-all; }
#files .num { text-align: right; font-variant-numeric: tabular-nums; }
#drop {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0.25rem; min-height: 110px; padding: 1rem; text-align: center; cursor: pointer;
  border: 1px dashed color-mix(in srgb, currentColor 50%, transparent);
}
#drop:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
#drop.over { border-style: solid; border-color: currentColor;
  background: color-mix(in srgb, currentColor 8%, transparent); }
#files input[type=password] { width: 100%; box-sizing: border-box; }
#files .owner { display: flex; flex-direction: column; gap: 0.4rem; padding-top: 0.75rem;
  border-top: 1px solid color-mix(in srgb, currentColor 15%, transparent); }
#files .owner label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
#files-msg { white-space: pre-line; word-break: break-all; }
#files-msg:empty { display: none; }
@media (max-width: 720px) {
  #main { flex-direction: column; }
  #editor { flex: none; height: 60vh; }
  #files { width: auto; border-left: 0;
    border-top: 1px solid color-mix(in srgb, currentColor 15%, transparent); }
}
</style>
</head>
<body>
<div id="bar">
  <a class="code" href="{{ url }}">{{ code }}</a>
  <div class="spacer"></div>
  <span id="lang">detecting…</span>
  <span id="status">connecting…</span>
</div>
<div id="main">
  <div id="editor"></div>
  <aside id="files" aria-label="files">
    <div class="head">files (<span id="file-count">0</span>)</div>
    <table id="file-table" hidden>
      <thead><tr><th>code</th><th>filename</th><th class="num">size</th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="files-empty" class="hint">none yet</p>
    <label id="drop" tabindex="0">
      <span id="drop-text">drop files here</span>
      <span class="hint">or click to choose</span>
      <input type="file" id="file-input" multiple hidden>
    </label>
    <input type="password" id="files-pw" placeholder="password" autocomplete="current-password" aria-label="password">
    <p id="pw-hint" class="hint"></p>
    <p id="files-msg" role="status"></p>
    <div class="owner">
      <div class="hint">owner settings (needs the owner's password above)</div>
      <label><input type="checkbox" id="open-uploads"> let anyone with this link upload</label>
      <p id="open-hint" class="hint"></p>
    </div>
  </aside>
</div>

<script>
// Files panel. Plain script, separate from the editor module, so the list and
// uploads keep working even if the editor's CDN modules fail to load.
(function () {
  const code = {{ code_json | safe }};
  const $ = (id) => document.getElementById(id);
  const tbody = $('file-table').querySelector('tbody');
  const pw = $('files-pw');
  const msg = $('files-msg');
  const drop = $('drop');
  const input = $('file-input');
  const openBox = $('open-uploads');
  let openUploads = false;
  let maxFile = 25 * 1024 * 1024;

  function fmtSize(b) {
    if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
    if (b >= 1024) return Math.round(b / 1024) + ' KB';
    return b + ' B';
  }

  function showOpen() {
    openBox.checked = openUploads;
    $('pw-hint').textContent = openUploads
      ? 'no password needed here: uploads are filed under the owner. leave it blank, or enter yours to file them under you.'
      : 'your zigi.zip password is needed to upload here.';
    $('open-hint').textContent = openUploads
      ? 'on: uploads without a password are filed under the owner, marked "via ' + code + '", download only, '
        + fmtSize(maxFile) + ' per file, 500 MB per note. turn off to cut access.'
      : 'off: only people with a zigi.zip password can upload. anyone with the link can still edit the note.';
  }

  async function refresh() {
    try {
      const r = await fetch('/' + code + '/files', { cache: 'no-store' });
      if (!r.ok) return;
      const data = await r.json();
      openUploads = !!data.open_uploads;
      if (data.max_file) maxFile = data.max_file;
      tbody.replaceChildren(...data.files.map((f) => {
        const tr = document.createElement('tr');
        const a = document.createElement('a');
        a.href = '/' + f.code;
        a.textContent = f.code;
        const c1 = document.createElement('td'); c1.append(a);
        const c2 = document.createElement('td'); c2.className = 'name'; c2.textContent = f.name;
        const c3 = document.createElement('td'); c3.className = 'num'; c3.textContent = fmtSize(f.size);
        tr.append(c1, c2, c3);
        return tr;
      }));
      $('file-count').textContent = data.files.length;
      $('file-table').hidden = data.files.length === 0;
      $('files-empty').hidden = data.files.length > 0;
      showOpen();
    } catch (e) {
      console.warn('file list', e);
    }
  }
  window.zigiFilesRefresh = refresh;

  async function uploadAll(files) {
    const list = Array.from(files || []);
    if (!list.length) return;
    const done = [];
    for (const f of list) {
      msg.textContent = 'uploading ' + f.name + '…';
      const fd = new FormData();
      // Password first: the server decides whose upload it is before the bytes.
      if (pw.value) fd.append('password', pw.value);
      fd.append('file', f, f.name);
      let res, data;
      try {
        res = await fetch('/' + code + '/files', { method: 'POST', body: fd });
        data = await res.json().catch(() => ({}));
      } catch (e) {
        msg.textContent = f.name + ': upload failed';
        break;
      }
      if (!res.ok) {
        msg.textContent = f.name + ': ' + (data.error || ('error ' + res.status));
        break;
      }
      done.push('file: ' + data.url);
      msg.textContent = done.join('\n');
    }
    refresh();
  }

  drop.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); }
  });
  input.addEventListener('change', () => { uploadAll(input.files); input.value = ''; });

  // Files dropped anywhere on the page land here, rather than the browser
  // navigating away to open them.
  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  let depth = 0;
  function setOver(on) {
    drop.classList.toggle('over', on);
    $('drop-text').textContent = on ? 'release to upload' : 'drop files here';
  }
  window.addEventListener('dragenter', (e) => { if (hasFiles(e)) { depth++; setOver(true); } });
  window.addEventListener('dragleave', (e) => { if (hasFiles(e) && --depth <= 0) { depth = 0; setOver(false); } });
  window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    depth = 0;
    setOver(false);
    uploadAll(e.dataTransfer.files);
  });

  openBox.addEventListener('change', async () => {
    const want = openBox.checked;
    openBox.checked = openUploads;
    if (!pw.value) { msg.textContent = 'enter the owner\'s password above first'; pw.focus(); return; }
    const body = new URLSearchParams({ password: pw.value, open_uploads: want ? 'true' : 'false' });
    // One change at a time, so replies can't land out of order.
    openBox.disabled = true;
    msg.textContent = 'checking password…';
    try {
      const r = await fetch('/' + code + '/settings', { method: 'POST', body });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) { msg.textContent = data.error || ('error ' + r.status); return; }
      openUploads = !!data.open_uploads;
      msg.textContent = openUploads ? 'uploads without a password: on' : 'uploads without a password: off';
      showOpen();
    } catch (e) {
      msg.textContent = 'could not change the setting';
    } finally {
      openBox.disabled = false;
    }
  });

  showOpen();
  refresh();
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
<!-- y-websocket and y-monaco are served with ?external=yjs, so their internal
     `import 'yjs'` is a bare specifier. This import map resolves it to the
     single shared copy — fixing Yjs's "already imported" sanity warning. -->
<script type="importmap">
{
  "imports": {
    "yjs": "https://esm.sh/yjs@13.6.18"
  }
}
</script>
<script type="module">
  const code = {{ code_json | safe }};
  const statusEl = document.getElementById('status');
  const langEl = document.getElementById('lang');

  function setStatus(s) { statusEl.textContent = s; }

  // Core editor: Monaco + Yjs + y-websocket. Anything below this must keep the
  // editor working even if it fails.
  // esm.sh honors ?external=yjs so y-websocket and y-monaco share the single
  // Yjs instance we load here (jsdelivr's +esm bundles a separate copy per dep,
  // which trips Yjs's "already imported" sanity check).
  let Y, WebsocketProvider, MonacoBinding;
  try {
    [Y, { WebsocketProvider }, { MonacoBinding }] = await Promise.all([
      import('https://esm.sh/yjs@13.6.18'),
      import('https://esm.sh/y-websocket@2.0.4?external=yjs'),
      import('https://esm.sh/y-monaco@0.1.6?external=yjs'),
    ]);
  } catch (e) {
    setStatus('failed to load editor modules');
    console.error(e);
    throw e;
  }

  const wsScheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${wsScheme}//${location.host}`;

  window.require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs' } });
  window.require(['vs/editor/editor.main'], async () => {
    const ydoc = new Y.Doc();
    const ytext = ydoc.getText('monaco');

    const provider = new WebsocketProvider(wsUrl, code + '/ws', ydoc, { connect: true });
    provider.on('status', (ev) => setStatus(ev.status || ev));
    // The server bumps this counter whenever the note's file list or upload
    // setting changes; reload the panel when it does.
    ydoc.getMap('zigi').observe(() => window.zigiFilesRefresh && window.zigiFilesRefresh());
    provider.on('connection-error', (e) => { setStatus('error'); console.error('ws error', e); });
    provider.on('connection-close', () => setStatus('disconnected'));
    provider.ws && (provider.ws.onerror = (e) => console.error('ws onerror', e));

    const editor = monaco.editor.create(document.getElementById('editor'), {
      value: '',
      language: 'plaintext',
      theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'vs-dark' : 'vs',
      automaticLayout: true,
      minimap: { enabled: false },
      fontSize: 13,
    });

    // y-monaco maps model offsets 1:1 onto Yjs offsets, so every client must
    // hold the text with identical line endings. Monaco defaults to CRLF on
    // Windows and rewrites incoming "\n" to its own EOL, which shifts every
    // later offset and lands remote edits in the wrong place. Force LF
    // everywhere, and strip any "\r\n" already stored in the doc before binding.
    const LF = monaco.editor.EndOfLineSequence.LF;
    const model = editor.getModel();
    model.setEOL(LF);
    editor.updateOptions({ readOnly: true });

    function stripCR() {
      const s = ytext.toString();
      if (!s.includes('\r\n')) return;
      // Deletes only, so concurrent clients doing the same converge.
      ydoc.transact(() => {
        for (let i = s.length - 2; i >= 0; i--) {
          if (s[i] === '\r' && s[i + 1] === '\n') ytext.delete(i, 1);
        }
      });
    }

    function bind() {
      stripCR();
      new MonacoBinding(ytext, model, new Set([editor]), provider.awareness);
      // The binding's setValue re-picks the platform default EOL when the
      // text has no line breaks yet.
      model.setEOL(LF);
      editor.updateOptions({ readOnly: false });
    }
    if (provider.synced) bind(); else provider.once('sync', bind);

    // Language detection loads lazily; if it fails, editor still works.
    const langMap = {
      js: 'javascript', ts: 'typescript', jsx: 'javascript', tsx: 'typescript',
      py: 'python', rb: 'ruby', rs: 'rust', go: 'go', java: 'java', kt: 'kotlin',
      cs: 'csharp', cpp: 'cpp', c: 'c', h: 'cpp', hpp: 'cpp', sh: 'shell', bat: 'bat',
      ps1: 'powershell', sql: 'sql', yaml: 'yaml', yml: 'yaml', toml: 'ini', ini: 'ini',
      json: 'json', xml: 'xml', html: 'html', css: 'css', scss: 'scss', md: 'markdown',
      php: 'php', swift: 'swift', r: 'r', lua: 'lua', pl: 'perl', hs: 'haskell',
      scala: 'scala', clj: 'clojure', dart: 'dart', ex: 'elixir', erl: 'erlang',
      jl: 'julia', dockerfile: 'dockerfile',
    };
    let detector = null;
    try {
      // esm.sh exposes ModelOperations as a named export.
      const ld = await import('https://esm.sh/@vscode/vscode-languagedetection@1.0.22');
      const ModelOperations = ld.ModelOperations || (ld.default && ld.default.ModelOperations) || ld.default;
      if (typeof ModelOperations !== 'function') throw new Error('ModelOperations not found on module');
      detector = new ModelOperations({
        modelJsonLoaderFunc: async () => (await fetch('https://cdn.jsdelivr.net/npm/@vscode/vscode-languagedetection@1.0.22/model/model.json')).json(),
        weightsLoaderFunc: async () => (await fetch('https://cdn.jsdelivr.net/npm/@vscode/vscode-languagedetection@1.0.22/model/group1-shard1of1.bin')).arrayBuffer(),
      });
      langEl.textContent = 'plaintext';
    } catch (e) {
      console.warn('language detection unavailable', e);
      langEl.textContent = 'plaintext';
    }

    let detectTimer = 0;
    function scheduleDetect() {
      if (!detector) return;
      clearTimeout(detectTimer);
      detectTimer = setTimeout(async () => {
        const text = model.getValue();
        if (text.length < 10) { langEl.textContent = 'plaintext'; return; }
        try {
          const res = await detector.runModel(text);
          if (res && res.length) {
            const top = res[0];
            const mapped = langMap[top.languageId] || top.languageId;
            const available = monaco.languages.getLanguages().some(l => l.id === mapped);
            const pick = available ? mapped : 'plaintext';
            monaco.editor.setModelLanguage(model, pick);
            langEl.textContent = `${pick} (${(top.confidence * 100).toFixed(0)}%)`;
          }
        } catch (e) {
          console.warn('detect failed', e);
        }
      }, 600);
    }
    ytext.observe(scheduleDetect);
    scheduleDetect();
  });
</script>
</body>
</html>
