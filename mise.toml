[tools]
# Pinned: deploys ship a binary built on the dev machine, so the toolchain that
# builds production should not drift with whatever rustup last installed.
rust = { version = "1.98.1", components = "clippy,rustfmt" }
"cargo:cargo-watch" = "latest"

[env]
# Local development config, kept outside the repo like production's
# (~/.config/zigi-zip/production). `mise run setup` creates it.
ZIGI_CONFIG = "{{env.HOME}}/.config/zigi-zip/development/config.toml"

[tasks.setup]
description = "Create the local dev database and config (idempotent)"
run = '''
set -euo pipefail
psql -lqt | cut -d'|' -f1 | grep -qw zigi_zip_dev || createdb zigi_zip_dev
if [[ ! -f "$ZIGI_CONFIG" ]]; then
    mkdir -p "$(dirname "$ZIGI_CONFIG")"
    (umask 077; sed \
        -e 's|^database_url = .*|database_url = "postgres:///zigi_zip_dev"|' \
        -e 's|^listen = .*|listen = "127.0.0.1:43803"|' \
        -e 's|^data_dir = .*|data_dir = "~/.local/share/zigi-zip/development"|' \
        -e 's|^base_url = .*|base_url = "http://127.0.0.1:43803"|' \
        -e 's|^bucket = .*|bucket = "zigi-zip-dev"|' \
        deploy/config.example.toml > "$ZIGI_CONFIG")
    echo "created $ZIGI_CONFIG; fill in the [r2] credentials for a dev bucket"
fi
'''

[tasks.dev]
description = "Run the server with hot-reload (applies migrations on start)"
run = "cargo watch -x 'run -- serve' -w src -w templates -w migrations"

[tasks.test]
description = "Run the test suite"
run = "cargo test"

[tasks.lint]
description = "Run clippy"
run = "cargo clippy --all-targets"

[tasks.fmt]
description = "Format the tree"
run = "cargo fmt"

[tasks.deploy]
description = "Build locally and deploy the binary and configuration to production"
run = "deploy/deploy.sh"
